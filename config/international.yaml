# PRE-REGISTERED international final test. Spec:
# docs/methodology/international-test.md (owner-approved 2026-10-21).
# Fixed before any result is seen. The first confirmed `run` pins this file's
# sha256 in the ledger (config_pins, name "international"); every later run
# refuses if the hash differs from the pin.
version: 1

# Used once each, in this order, for successive accepted rules.
sets:
  - name: main
    markets: [EWJ, EWU, EWG, EWC, EWA, EWL, EWQ]
    min_pass: 5
  - name: reserve_1
    markets: [EWN, EWD, EWP, EWI, EWH, EWS]
    min_pass: 4
  - name: reserve_2
    markets: [EWZ, EWT, EWY, EEM]
    min_pass: 3

# Scored years only. The last window runs to the frozen data end (null).
windows:
  - {start: "1997-01-01", end: "2004-12-31"}
  - {start: "2023-01-01", end: null}
excluded: {start: "2005-01-01", end: "2022-12-31"}
download_start: "1996-01-01"
min_scored_days: 500

thresholds:
  sharpe_margin: 0.05
  cagr_tolerance: 0.01

# Legs that stay the US-dollar investor's. A ticker on this list is never the
# equity leg. CASH is priced from DTB3 (see proxies.cash).
defensive: [GLD, IEF, TLT, SHY, CASH]
# Strategies (REGISTRY names) the test covers; any other is refused.
covered_strategies: [core_trend, core_mix]

# Amendment 2026-10-22 (owner-approved, spec docs/methodology/international-test.md,
# made before any international run): the held core A may be the subject of
# `run --designated` although it did not pass validation. Its one pre-registered
# fixed standalone attempt (ledger test 1496) failed. Results for it are labelled
# "subject not validated". The --test-id gate is unchanged.
designated_core:
  family: core_trend
  params: {risk_on: QQQ, risk_off: GLD, lookback: 200}
  failed_attempt_test_id: 1496
  reason: "held core A; failed fixed standalone attempt (ledger run 8, test 1496); owner-designated subject, not validated"

proxies:
  yield_lag_business_days: 1  # FRED yields only; GC=F is a market price, not lagged
  treasury:
    SHY: {fred: DGS2, duration: 1.9}
    IEF: {fred: DGS10, duration: 7.5}
    TLT: {fred: DGS20, duration: 17.0}
  cash:
    fred: DTB3  # daily return = previous (lagged) yield / 252; no fund, whole backtest
  gold:
    ticker: GC=F
    fund: GLD
    check_start: "2004-11-18"
    check_end: "2006-12-31"
    min_correlation: 0.95
