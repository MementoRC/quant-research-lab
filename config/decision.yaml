# PRE-REGISTERED decision-helper configuration (spec:
# docs/methodology/decision-helper.md; owner-approved design 2026-10-06).
# Pre-registered on 2026-10-06, fixed before any result was seen. Every report
# records this file's sha256. After the first `pixi run decision` report,
# change only via a dated amendment comment here.
#
# A-G are read from config/core_candidates.yaml, unchanged; its sha256 is
# pinned below (the value config/core_shortlist.yaml records) and checked on
# load. Every portfolio is 100% of capital. Only data up to 2018-12-31 (the
# research end) are used; the loader refuses any window or start year past it.
version: 1
candidates_sha256: "1a84847ed4ae59e81627c420b88f7736357f0bdc0bcb654a945c5d2ad88107e3"

# Amendment 2026-10-10 (owner-approved design, spec
# docs/methodology/defensive-sleeve.md): statics IEF, TLT, RSP, BONDS and
# blends A80-*20 added for the defensive-sleeve comparison. Existing
# entries unchanged; candidates_sha256 unchanged.
# Static mixes: weights are fractions of capital and must sum to 1.
static:
  - {id: CASH, label: "100% SHY", mix: {SHY: 1.0}}
  - {id: G-EW, label: "25% each RSP / TLT / GLD / SHY", mix: {RSP: 0.25, TLT: 0.25, GLD: 0.25, SHY: 0.25}}
  - {id: IEF, label: "100% IEF", mix: {IEF: 1.0}}
  - {id: TLT, label: "100% TLT", mix: {TLT: 1.0}}
  - {id: RSP, label: "100% RSP", mix: {RSP: 1.0}}
  - {id: BONDS, label: "1/3 each SHY / IEF / TLT", mix: {SHY: 0.3333333333333333, IEF: 0.3333333333333333, TLT: 0.3333333333333333}}

# Blends of A-G and static mixes: daily weights are the share-weighted sum of
# the parts' weights, so a switching part (A) keeps switching inside a blend.
blends:
  - {id: AG, label: "1/2 A + 1/2 G", parts: {A: 0.5, G: 0.5}}
  - {id: G-CASH, label: "1/2 G + 1/2 CASH", parts: {G: 0.5, CASH: 0.5}}
  - {id: A-CASH, label: "1/2 A + 1/2 CASH", parts: {A: 0.5, CASH: 0.5}}
  - {id: A80-CASH20, label: "80% A + 20% CASH", parts: {A: 0.8, CASH: 0.2}}
  - {id: A80-IEF20, label: "80% A + 20% IEF", parts: {A: 0.8, IEF: 0.2}}
  - {id: A80-TLT20, label: "80% A + 20% TLT", parts: {A: 0.8, TLT: 0.2}}
  - {id: A80-BONDS20, label: "80% A + 20% BONDS", parts: {A: 0.8, BONDS: 0.2}}
  - {id: A80-RSP20, label: "80% A + 20% RSP", parts: {A: 0.8, RSP: 0.2}}
  - {id: B80-CASH20, label: "80% B + 20% CASH", parts: {B: 0.8, CASH: 0.2}}
  - {id: C80-CASH20, label: "80% C + 20% CASH", parts: {C: 0.8, CASH: 0.2}}
  - {id: D80-CASH20, label: "80% D + 20% CASH", parts: {D: 0.8, CASH: 0.2}}
  - {id: E80-CASH20, label: "80% E + 20% CASH", parts: {E: 0.8, CASH: 0.2}}
  - {id: F80-CASH20, label: "80% F + 20% CASH", parts: {F: 0.8, CASH: 0.2}}
  - {id: G80-CASH20, label: "80% G + 20% CASH", parts: {G: 0.8, CASH: 0.2}}

# Amendment 2026-10-11 (owner-approved design, spec
# docs/methodology/true-cash-sleeve.md): optional cash_assumption row
# A80-TCASH20 added. It is not a portfolio: it never enters the windows,
# scenarios or year-one tables. Existing entries unchanged; candidates_sha256
# unchanged.
#
# Amendment 2026-10-12 (owner-approved design, spec
# docs/methodology/true-cash-all-cores.md): blends B80-CASH20 ... G80-CASH20
# added; cash_assumption replaced by the list cash_assumptions, whose first
# entry is the former A80-TCASH20 row unchanged plus its pair. Existing
# portfolios unchanged; candidates_sha256 unchanged.
cash_assumptions:
  - {id: A80-TCASH20, label: "80% A + 20% cash at +1% real (assumption)",
     base: A, cash_share: 0.2, real_yield: 0.01, pair: A80-CASH20}
  - {id: B80-TCASH20, label: "80% B + 20% cash at +1% real (assumption)",
     base: B, cash_share: 0.2, real_yield: 0.01, pair: B80-CASH20}
  - {id: C80-TCASH20, label: "80% C + 20% cash at +1% real (assumption)",
     base: C, cash_share: 0.2, real_yield: 0.01, pair: C80-CASH20}
  - {id: D80-TCASH20, label: "80% D + 20% cash at +1% real (assumption)",
     base: D, cash_share: 0.2, real_yield: 0.01, pair: D80-CASH20}
  - {id: E80-TCASH20, label: "80% E + 20% cash at +1% real (assumption)",
     base: E, cash_share: 0.2, real_yield: 0.01, pair: E80-CASH20}
  - {id: F80-TCASH20, label: "80% F + 20% cash at +1% real (assumption)",
     base: F, cash_share: 0.2, real_yield: 0.01, pair: F80-CASH20}
  - {id: G80-TCASH20, label: "80% G + 20% cash at +1% real (assumption)",
     base: G, cash_share: 0.2, real_yield: 0.01, pair: G80-CASH20}

# Historical windows, by name, from config/stress.yaml (read, never edited).
windows: [dotcom_2000, gfc_2008]

# A frozen cell whose total proxied share exceeds this is marked
# "mostly proxied, indicative only".
proxied_indicative_above: 0.25

# Judgement-based one-year shocks, v1: a total return for EVERY held fund plus
# one-year inflation. Judgements, not data. The four class-based stress.yaml
# hypotheticals are added only after the owner sets their inflation and
# approves the translated rows (spec, "Judgement-based shocks").
scenarios:
  - name: treasury_dollar_crisis
    label: "judgement-based, v1"
    returns: {SPY: -0.25, QQQ: -0.30, RSP: -0.22, SHY: 0.01, IEF: -0.12, TLT: -0.30, GLD: 0.25}
    inflation: 0.08
  - name: trade_oil_shock
    label: "judgement-based, v1"
    returns: {SPY: -0.20, QQQ: -0.25, RSP: -0.18, SHY: 0.02, IEF: -0.06, TLT: -0.15, GLD: 0.10}
    inflation: 0.07
  - name: ai_megacap_crash
    label: "judgement-based, v1"
    returns: {SPY: -0.30, QQQ: -0.45, RSP: -0.15, SHY: 0.03, IEF: 0.06, TLT: 0.12, GLD: 0.05}
    inflation: 0.02

# Annual withdrawal rates (fraction of the starting value; raised by CPI).
withdrawal_rates: [0.02, 0.033, 0.04, 0.05]

# Each path starts on the first trading day of January and ends 2018-12-31.
start_years: [2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014]
