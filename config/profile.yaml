# ---------------------------------------------------------------------------
# TRADER PROFILE — owner decisions that shape data, timeframe, and strategy fit.
#
# This is not a pass/fail file like criteria.yaml; it describes the human, not
# the backtest. Run `pixi run profile-check` after any edit to see what the
# profile implies and whether it conflicts with itself or with criteria.yaml.
# ---------------------------------------------------------------------------
version: 1

# growth | income | conservative
goal: growth

# Target trades per week across the whole sleeve (rough sizing input, not a hard cap).
trades_per_week: 3

# How long a sleeve trade is typically held, in trading days.
holding_period_days: {min: 2, max: 15}

# Whether positions may be held over market close (swing trading needs this).
overnight_holds: true

# Largest peak-to-trough loss the owner can tolerate without abandoning the process.
max_drawdown: 0.35

# core: always-invested, rarely-trading holdings. sleeve: short swing trades.
# The sleeve universe (which stocks) is defined separately in config/universe.yaml
# (milestone 2.1); here it is just named.
assets:
  core: [QQQ, GLD]
  sleeve: us_large_cap_stocks

# free | paid. Free daily bars (Yahoo) lack deep intraday history.
data_budget: free

# Fraction of capital in each bucket. Must sum to 1.
capital_split: {core: 0.80, sleeve: 0.20}

# Owner decision, 2026-09-24: no leverage. src/qrl/engine.py:63-64 raises on
# any weight set summing above 1.0, so these two must stay at 1.0 unless that
# guard changes -- profile-check flags it if they do not agree.
risk:
  leverage_ceiling: 1.0
  max_gross_exposure: 1.0
  # Annual bps charged on capital above 1.0. Moot while leverage_ceiling is 1.0;
  # recorded so that enabling leverage later is a config decision, not a code one.
  borrowing_cost_bps: 0
  # Largest fraction of TOTAL capital one sleeve position may lose. The engine has
  # no stop-loss, so the enforceable reading is the conservative worst case: the
  # position goes to zero. It is therefore a cap on single-position WEIGHT.
  # 0.04 = capital_split.sleeve (0.20) / the most concentrated max_positions the
  # sleeve search space allows (5, see strategies/__init__.py). Lowering it below
  # 0.04 would put that existing search space out of policy.
  max_loss_per_trade: 0.04
  # Portfolio-wide cap on simultaneously held sleeve names. 15 is the top of the
  # declared max_positions search space [5, 10, 15]; a lower value here would
  # retroactively put part of ledger run 1's search space out of policy.
  max_open_positions: 15
