[workspace]
name = "quant-research-lab"
version = "0.1.0"
description = "Quant research lab: a disciplined backtesting pipeline with a static dashboard"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.1"
numpy = ">=1.26"
pyyaml = ">=6.0"
yfinance = ">=0.2.50"
pyarrow = ">=14.0"
xlrd = ">=2.0.2,<3"
openpyxl = ">=3.1.5,<4"

[tasks]
build-site = "python scripts/build_site.py"
profile-check = "python scripts/profile_check.py"
data-check = "python scripts/data_check.py"
daily-check = "python scripts/daily_check.py"
stress = "python scripts/stress.py"
core-compare = "python scripts/core_compare.py"
core-reveal = "python scripts/core_reveal.py"
decision = "python scripts/decision.py"
whatif = "python scripts/whatif.py"
whatif-shock = "python scripts/whatif_shock.py"
overlay = "python scripts/overlay.py"
international = "python scripts/international.py"
longrun = "python scripts/longrun.py"
withdrawal-rules = "python scripts/withdrawal_rules.py"
history-scenarios = "python scripts/history_scenarios.py"
staged-entry = "python scripts/staged_entry.py"
rsp-sleeve = "python scripts/rsp_sleeve.py"
fragility = "python scripts/fragility.py"
paper-track = "python scripts/paper_track.py"
export-ledger = "python scripts/export_ledger.py"
search = "python scripts/search.py"
validate = "python scripts/validate.py"
fetch-fundamentals = "python scripts/fetch_fundamentals.py"
build-pit-universe = "python scripts/pit_universe.py build"
pit-coverage = "python scripts/pit_universe.py coverage"
factor-smoke = "python scripts/factor_smoke.py"
null-sleeve = "python scripts/null_sleeve.py"
rebuild-validation = "python scripts/rebuild_validation.py"
walk-forward = "python scripts/walkforward.py"
unseal-holdout = "python scripts/unseal_holdout.py"
docs-regen = "python scripts/docs_regen.py"

[feature.ci.dependencies]
ruff = ">=0.8.4"
mypy = ">=1.14.0"
pytest = ">=8.0.0"
pytest-cov = ">=6.0.0"
bandit = ">=1.8.0"
pre-commit = ">=4.0.0"
python-build = ">=1.0.0"
setuptools = ">=68"
pandas-stubs = "*"
types-pyyaml = "*"

[feature.ci.tasks]
lint = "ruff check ."
lint-fix = "ruff check --fix ."
format = "ruff format ."
format-check = "ruff format --check ."
type-check = "mypy src/qrl"
quality = { depends-on = ["lint", "format-check", "type-check"] }
test = "pytest tests/ --cov=qrl --cov-report=term-missing"
security = "bandit -c pyproject.toml -r src/qrl"
pre-commit-install = "pre-commit install"
pre-commit-run = "pre-commit run --all-files"
build = "python -m build"

[feature.dev.tasks]
serve = "python -m http.server -d site 8000"

# IB paper rebalancer (docs/methodology/broker-rebalancer.md). The connector
# needs Python >= 3.12; Part B adds it as a pinned pypi git dependency.
# default/dev/ci never install it.
[feature.broker.dependencies]
python = "3.12.*"
# ib_async 2.1.0 (latest on PyPI, checked 2026-11-08) declares
# Requires-Dist: tzdata>=2025.2,<2026.0; the conda solve would otherwise pin 2026.x.
python-tzdata = ">=2025.2,<2026"

[feature.broker.pypi-dependencies]
# Standalone connector repo, pinned to origin/development on 2026-11-05 (#184 MOO, #185 account summary).
hb-market-connector = { git = "https://github.com/MementoRC/hb-market-connector.git", rev = "5829aa1b3b062f2081ee8b29d80b910de40306be" }
# The connector declares no optional extras, so its IB client is listed here.
ib_async = ">=2.1.0,<3.0.0"

[feature.broker.tasks]
rebalance = "python scripts/rebalance.py"

[environments]
default = { solve-group = "default" }
dev = { features = ["ci", "dev"], solve-group = "default" }
ci = { features = ["ci"], solve-group = "default" }
quality-extended = { features = ["ci"], solve-group = "default" }
quality-ci = { features = ["ci"], solve-group = "default" }
broker = { features = ["broker", "ci"], solve-group = "broker" }
