name: Build and deploy dashboard

on:
  push:
    branches: [development]
  schedule:
    # 22:30 UTC on weekdays, after the US close in both summer and winter time.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development

      - name: "Setup PIXI Environment"
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.74.0
          environments: ci
          cache: true

      - name: Run tests (engine timing, costs, look-ahead checks)
        run: pixi run -e ci test

      - name: Backtest and build results
        run: pixi run -e ci build-site --refresh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
