name: Build and deploy dashboard

on:
  push:
    branches: [development]
  schedule:
    # 22:30 UTC on weekdays, after the US close in both summer and winter time.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: development

      - name: "Setup PIXI Environment"
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.74.0
          environments: ci
          cache: true

      - name: Run tests (engine timing, costs, look-ahead checks)
        run: pixi run -e ci test

      - name: Export research ledger
        run: pixi run -e ci export-ledger

      - name: Backtest and build results
        run: pixi run -e ci build-site --refresh

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
